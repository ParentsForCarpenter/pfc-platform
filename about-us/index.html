<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parents for Carpenter</title>
  <meta name="description" content="Parents for Carpenter supports enrichment, community, and school programs for Carpenter Community Charter." />
  <style>
    :root{--navy:#082b7f;--pink:#e83e8c;--blue:#dff3ff;--debug:rgba(232,62,140,.22)}
    *{box-sizing:border-box} body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#0b2d76} a{color:inherit}
    .stage{width:100%;max-width:1366px;margin:0 auto;position:relative;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
    .page-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;display:block;text-indent:-9999px;overflow:hidden;border-radius:8px;cursor:pointer;text-decoration:none;z-index:5;outline:none}
    .hotspot:focus{box-shadow:0 0 0 4px rgba(232,62,140,.5)}
    .debug .hotspot{background:var(--debug);border:2px solid var(--pink);text-indent:0;color:#061f63;font-weight:700;font-size:12px;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px;text-shadow:0 1px #fff;overflow:visible}
    .debug-banner{position:fixed;right:10px;bottom:10px;z-index:99;background:#082b7f;color:#fff;border-radius:999px;padding:8px 12px;font:700 13px Arial;box-shadow:0 8px 20px rgba(0,0,0,.22)}
    .placeholder{max-width:900px;margin:60px auto;padding:30px 24px;text-align:center;line-height:1.6}.placeholder h1{color:#082b7f;font-size:42px;margin:0 0 10px}.placeholder a{font-weight:700;color:#e83e8c}
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const LOGIN = 'https://pfc.membershiptoolkit.com';
    const DONATE = 'https://pfc.membershiptoolkit.com/login-form?r=%2Fopen_forms';
    const EMAIL = 'mailto:CarpenterPFC@ParentsForCarpenter.org';

    const pages = {
      '/': { title:'Parents for Carpenter', img:'/assets/pages/home.svg', vw:1024.5, vh:1465.5, spots:[
        nav('about-us','ABOUT US',165,38,95,48), nav('programs','PROGRAMS',280,38,120,48), nav('support-us','SUPPORT US',410,38,125,48), nav('contact-us','CONTACT US',555,38,120,48), ext(LOGIN,'LOGIN / REGISTER',690,28,160,60), ext(DONATE,'DONATE',860,28,150,60),
        
        ext(DONATE,'Donate Card',30,815,235,415), link('/support-us','Volunteer Card',285,815,235,415), link('/community-partners','Community Partners Card',540,815,235,415), ext(LOGIN,'Membership Toolkit Card',790,815,220,415),
        ext(EMAIL,'Footer Email',650,1285,360,65), link('/contact-us','Footer Contact',640,1240,370,130)
      ]},
      '/about-us': { title:'About PFC', img:'/assets/pages/About Us.svg', vw:1024.5, vh:1328.25, spots:[
        nav('','HOME',210,38,80,48), nav('programs','PROGRAMS',300,38,125,48), nav('support-us','SUPPORT US',445,38,125,48), nav('contact-us','CONTACT US',585,38,120,48), ext(LOGIN,'LOGIN / REGISTER',725,28,145,60), ext(DONATE,'DONATE',890,28,125,60), ext(EMAIL,'Footer Email',670,1180,330,70), link('/contact-us','Footer Contact',640,1130,380,140)
      ]},
      '/programs': { title:'Programs', img:'/assets/pages/Programs.svg', vw:1024.5, vh:1509.75, spots:[
        nav('','HOME',205,38,80,48), nav('about-us','ABOUT US',288,38,115,48), nav('support-us','SUPPORT US',425,38,120,48), nav('contact-us','CONTACT US',570,38,120,48), ext(LOGIN,'LOGIN / REGISTER',700,28,150,60), ext(DONATE,'DONATE',860,28,150,60),
        ext(EMAIL,'Footer Email',670,1370,330,65), link('/contact-us','Footer Contact',640,1320,380,140)
      ]},
      '/support-us': { title:'Support PFC', img:'/assets/pages/Support Us.svg', vw:1024.5, vh:2181.75, spots:[
        nav('','HOME',200,38,80,48), nav('about-us','ABOUT US',285,38,110,48), nav('programs','PROGRAMS',410,38,120,48), nav('contact-us','CONTACT US',555,38,120,48), ext(LOGIN,'LOGIN / REGISTER',700,28,150,60), ext(DONATE,'DONATE',860,28,150,60),
        ext(DONATE,'AGC Donate',225,580,180,70), link('/support-us','D.E.N.',45,715,450,300), link('/support-us','Gala & Auction',525,715,450,300), link('/support-us','Party Book',45,1085,285,330), link('/support-us','Spread the Love',365,1085,285,330), link('/support-us','Corporate Matching',690,1085,285,330), link('/support-us','Online Sales',45,1515,285,330), link('/support-us','Restaurant Night',365,1515,285,330), link('/support-us','Trivia Night',690,1515,285,330), ext(EMAIL,'Footer Email',670,2030,330,65), link('/contact-us','Footer Contact',640,1980,380,140)
      ]},
      '/contact-us': { title:'Contact Us', img:'/assets/pages/Contact Us.svg', vw:1024.5, vh:1148.25, spots:[
        nav('','HOME',210,38,80,48), nav('about-us','ABOUT US',290,38,110,48), nav('programs','PROGRAMS',420,38,120,48), nav('support-us','SUPPORT US',555,38,120,48), ext(LOGIN,'LOGIN / REGISTER',695,28,150,60), ext(DONATE,'DONATE',860,28,150,60),
        ext(EMAIL,'Main Email',70,650,300,150), ext(EMAIL,'Footer Email',660,980,330,65), link('/contact-us','Footer Contact',640,940,380,140)
      ]}
    };

    const placeholders = {
      '/music':'Music','/science':'Science','/art':'Art','/dance-movement':'Dance & Movement','/physical-education':'Physical Education','/student-support':'Student Support','/community-partners':'Community Partners'
    };

    function nav(path,label,x,y,w,h){ return link('/'+path,label,x,y,w,h); }
    function link(href,label,x,y,w,h){ return {href,label,x,y,w,h,external:false}; }
    function ext(href,label,x,y,w,h){ return {href,label,x,y,w,h,external:true}; }

    function render(){
      const raw = window.location.pathname.replace(/\/$/,'') || '/';
      const page = pages[raw];
      document.title = (page?.title || placeholders[raw] || 'Parents for Carpenter') + ' | Parents for Carpenter';
      const app = document.getElementById('app');
      if(!page){
        app.innerHTML = `<section class="placeholder"><h1>${placeholders[raw] || 'Page Coming Soon'}</h1><p>This page is being prepared for the full website launch.</p><p><a href="/">Return to Home</a></p></section>`;
        wireInternalLinks(); return;
      }
      const spots = page.spots.map(s=>`<a class="hotspot" href="${s.href}" ${s.external?'target="_blank" rel="noopener"':''} style="left:${s.x/page.vw*100}%;top:${s.y/page.vh*100}%;width:${s.w/page.vw*100}%;height:${s.h/page.vh*100}%;">${s.label}</a>`).join('');
      app.innerHTML = `<div class="stage" id="stage"><img class="page-img" src="${page.img}" alt="${page.title}"/>${spots}</div><div class="debug-banner" id="debugBanner" hidden>Hotspot debug ON — press D to hide</div>`;
      wireInternalLinks();
    }
    function wireInternalLinks(){
      document.querySelectorAll('a[href^="/"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); history.pushState({},'',a.getAttribute('href')); render(); scrollTo(0,0);}));
    }
    window.addEventListener('popstate',render);
    document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='d'){ const st=document.getElementById('stage'); const b=document.getElementById('debugBanner'); if(st){st.classList.toggle('debug'); if(b)b.hidden=!st.classList.contains('debug');}}});
    render();
  </script>
</body>
</html>
